name: Feature request
description: Suggest something the app should be able to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the app makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like instead
    validations:
      required: true
  - type: checkboxes
    id: checked-plan
    attributes:
      label: Before you post
      options:
        - label: >
            I checked PLAN.md — this is not already planned for a later phase, and not
            listed as out of scope.
          required: true

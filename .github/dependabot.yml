version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # This app holds a Google token with write access to a Drive folder, so security updates
  # matter more than novelty. Patch/minor bumps are grouped into one PR a month; majors come
  # separately so they get read properly.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build

  # git-cliff and, from Phase 5, the Firebase rules tests.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      prefix-development: build

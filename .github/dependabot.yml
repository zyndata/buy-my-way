version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # This app holds a Firebase session that can read and write every list its user belongs
  # to, so security updates matter more than novelty. Patch/minor bumps are grouped into one PR a month; majors come
  # separately so they get read properly.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build

  # git-cliff.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      prefix-development: build

  # The Firebase rules tests (emulator, rules-unit-testing).
  - package-ecosystem: npm
    directory: /firebase
    schedule:
      interval: monthly
    groups:
      firebase-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      prefix-development: build

name: Release

# A release is a deliberate act: tag a commit on `main` with a SemVer tag (v1.2.3) and push it.
# Pushing a plain commit to `main` does nothing. The instrumented gate is NOT here — it runs on
# `dev` in ci.yml, and only a `dev` commit whose run is green may be merged and tagged
# (CLAUDE.md). This workflow repeats lint and the unit tests so a red tag stops before it
# publishes anything, and then builds, signs and publishes the APK.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write # the CHANGELOG commit-back and the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check, test & build the signed APK
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.name.outputs.apk }}
    steps:
      # Full history and tags: the app's versionName and versionCode come from `git describe`,
      # so a shallow clone would build a release that calls itself 0.0.0-dev.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Lint & unit tests
        run: ./gradlew lint testDebugUnitTest --no-daemon

      # The keystore lives only in GitHub Secrets and in the owner's password manager
      # (CLAUDE.md). It is written outside the workspace so no step can archive it by accident,
      # and it is gone with the runner.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set — a Release with an unsigned APK is worse than no Release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: assembleRelease
        env:
          BUYMYWAY_KEYSTORE: ${{ runner.temp }}/release.jks
          BUYMYWAY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUYMYWAY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BUYMYWAY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # The name a person downloads, and the checksum they can compare. Both are what
      # docs/DEPLOYMENT.md tells the owner to expect on the Release page.
      - name: Name the APK and check it is signed
        id: name
        run: |
          set -euo pipefail
          apk="buy-my-way-${GITHUB_REF_NAME}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          # An unsigned APK would install nowhere; fail here rather than on somebody's phone.
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: |
            ${{ steps.name.outputs.apk }}
            ${{ steps.name.outputs.apk }}.sha256
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lint-and-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  release:
    name: Changelog & GitHub Release
    needs: build # never cut a release off a red build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff needs the full history and every tag

      - uses: actions/download-artifact@v8
        with:
          name: apk

      # CHANGELOG.md is generated from the Conventional Commit messages, never hand-edited
      # (CLAUDE.md). It is committed back to `main`; the /release skill brings it to `dev`.
      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }} -o CHANGELOG.md

      - name: Commit CHANGELOG.md to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -m "chore(release): update CHANGELOG for ${{ github.ref_name }}"
            git push origin HEAD:main
          fi

      - name: Release notes for this version only
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }} --latest --strip all

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.content }}
          files: |
            ${{ needs.build.outputs.apk }}
            ${{ needs.build.outputs.apk }}.sha256
          fail_on_unmatched_files: true

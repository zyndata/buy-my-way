name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

# Read-only token: nothing here writes to the repo.
permissions:
  contents: read

# A newer push to the same ref makes the running job pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, unit tests & debug build
    runs-on: ubuntu-latest
    steps:
      # Full history: the app's versionName comes from `git describe`, and a shallow clone
      # with no tags would leave every CI build calling itself by a commit hash.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Lint, unit tests, debug build
        run: ./gradlew lint testDebugUnitTest assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lint-and-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  # This project's e2e gate, and the reason a release may only be cut from a `dev` commit whose
  # run is green. Arrived in Phase 2 with the Room tests (STATE.md decisions 33 and 38); Phase 3
  # adds its UI tests to the same job.
  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_LEVEL: 35
      TARGET: google_apis
      ARCH: x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # The hosted runner has KVM, but only root may use it until this rule is added.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A booted AVD snapshot, so later runs skip the cold boot.
      - uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}

      - name: Create the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created."

      - name: connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  # The Realtime Database rules against the Firebase emulator (PLAN.md Phase 4, task 3). A demo
  # project id: no login, no secret, never the real project (STATE.md decision 53).
  rules:
    name: Database rules tests (emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      # The database emulator is a Java program.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}

      - run: npm ci --no-audit --no-fund

      - run: npm test
